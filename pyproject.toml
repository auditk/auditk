[project]
name = "glasshouse-core"
version = "0.0.1"
description = "Python reference implementation of glasshouse-spec — the open standard for agent alignment evidence."
authors = [
    { name = "Matt Haiko" },
    { name = "The glasshouse Project Contributors" },
]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "ai",
    "agents",
    "alignment",
    "interpretability",
    "audit",
    "compliance",
    "evidence",
    "eu-ai-act",
    "fca",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5",
    "typer>=0.12",
    "cryptography>=42.0",
    "pyyaml>=6.0",
    "tenacity>=8.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "jsonschema>=4.21",
    "respx>=0.21",
]
langgraph = ["langgraph>=0.2"]
browser = ["browser-use>=0.1"]
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]
pdf = ["weasyprint>=62.0"]

[project.urls]
Homepage = "https://github.com/haikomatt/glasshouse-core"
Spec = "https://github.com/haikomatt/glasshouse-spec"
Issues = "https://github.com/haikomatt/glasshouse-core/issues"

[project.scripts]
glasshouse = "glasshouse_core.cli:app"

[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glasshouse_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit
    "C90", # mccabe complexity
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
