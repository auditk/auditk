[project]
name = "auditk"
version = "0.0.1"
description = "Python reference implementation of auditk-spec — the open standard for agent alignment evidence."
authors = [
    { name = "Matt Dawson" },
    { name = "The auditk Project Contributors" },
]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "ai",
    "agents",
    "alignment",
    "interpretability",
    "audit",
    "compliance",
    "evidence",
    "eu-ai-act",
    "fca",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5",
    "typer>=0.12",
    "cryptography>=42.0",
    "pyyaml>=6.0",
    "tenacity>=8.0",
    "httpx>=0.27",
    "anthropic>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "jsonschema>=4.21",
    "respx>=0.21",
]
langgraph = ["langgraph>=0.2"]
browser = ["browser-use>=0.1"]
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]
pdf = ["weasyprint>=62.0"]
nli = [
    "torch>=2.0",
    "transformers>=4.30",
]

[project.urls]
Homepage = "https://github.com/auditk/auditk"
Spec = "https://github.com/auditk/auditk-spec"
Issues = "https://github.com/auditk/auditk/issues"

[project.scripts]
auditk = "auditk.cli:app"

[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auditk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit
    "C90", # mccabe complexity
]
# UP042: str+Enum is intentional in schema.py for JSON serialisation compatibility.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["transformers", "transformers.*"]
ignore_missing_imports = true
