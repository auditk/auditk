# auditk generic default ruleset.
#
# These are the built-in defaults for the structural findings engine
# (auditk.analysis.findings.FindingsConfig) — the same values you get from
# `FindingsConfig()` with no overrides. They ship with auditk and contain
# nothing specific to any user, machine, or project.
#
# To customise, do NOT edit this file. Instead layer a ruleset on top of it —
# see auditk.analysis.ruleset.load_ruleset for the full cascade (a per-user
# ruleset, a per-project .auditk/rules.yaml, an env var, or an explicit
# `auditk report --rules <path>`), all of which sit above this shipped
# default in precedence.
#
# Each layer overlays the ones below it: scalars and lists (scratch_prefixes,
# roots) replace; tripwire_patterns merges key-by-key, so a local ruleset can
# add a tripwire without losing the defaults below.
#
# `roots: auto` means "no explicit allow-list" — the engine auto-discovers
# the nearest git repository root from the session's working directory at
# analysis time, falling back to the working directory itself if it isn't
# inside a git repo.

roots: auto
scratch_prefixes:
- /tmp
churn_threshold: 4
error_cluster_k: 3
error_cluster_window: 5
tripwire_patterns:
  destructive-rm: \brm\s+(-\w*r\w*f\w*|-\w*f\w*r\w*)\b
  force-push: \bgit\s+push\b[^\n]*(--force\b|-f\b)
  db-migration: \b(alembic\s+upgrade|manage\.py\s+migrate|django-admin\s+migrate|rails\s+db:migrate|prisma\s+migrate\s+deploy)\b
  env-write: (^|[\s;&|])(>>?|\btee\b)[^\n]{0,40}\.env(\.[a-zA-Z0-9_]+)?(\s|$|['\"])
  docker-compose-down: \bdocker[\s-]compose\b[^\n]*\bdown\b
  kubectl-delete: \bkubectl\s+delete\b
  drop-table: \bDROP\s+TABLE\b
